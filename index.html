<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fresh Fruits Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍎 Fresh Fruits Store</h1>
    <div class="cart">
        🛒 Cart: <span id="cart-count">0</span> items |
        Total: $<span id="cart-total">0</span>
    </div>
</header>

<section class="products">
    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Apple">
        <h3>Apple</h3>
        <p>$2 each</p>
        <button onclick="addToCart('Apple', 2)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Banana">
        <h3>Banana</h3>
        <p>$1 each</p>
        <button onclick="addToCart('Banana', 1)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Orange">
        <h3>Orange</h3>
        <p>$3 each</p>
        <button onclick="addToCart('Orange', 3)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Mango">
        <h3>Mango</h3>
        <p>$4 each</p>
        <button onclick="addToCart('Mango', 4)">Add to Cart</button>
    </div>
</section>

<section class="cart-section">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
</section>

<script src="script.js"></script>
</body>
</html>
